# Secret rotation policy — machine-readable source of truth.
#
# Consumed by:
#   - scripts/secrets/rotate-secret.sh   (--report and per-secret rotation)
#   - scripts/secrets/validate-secrets.sh (presence + freshness checks)
#   - .github/workflows/secrets-rotation-check.yml
#
# Rotation is enforced: a secret older than `intervalDays + graceDays` is a
# CI failure and opens an incident issue.

apiVersion: hw.devops/v1
kind: SecretRotationPolicy
metadata:
  name: health-watchers-secrets
  owner: platform-engineering

defaults:
  graceDays: 7
  # Regions that receive an encrypted replica for DR (AWS Secrets Manager).
  replicaRegions:
    - eu-west-1
  # Minimum acceptable Shannon entropy (bits/char) for generated secrets.
  minEntropyBitsPerChar: 3.5
  # Reject values that look like shipped placeholders.
  placeholderPatterns:
    - 'changeme'
    - 'example'
    - 'your_.*_here'
    - 'REPLACE_ME'
    - 'xxxxxxxx'

secrets:
  - name: mongo-password
    type: db-credential
    intervalDays: 30
    method: automated # dual-user swap via rotation Lambda
    lambdaArn: 'arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:health-watchers-secret-rotation'
    consumers: [health-watchers-api, health-watchers-stellar-service]
    reloadStrategy: rolling-restart
    minLength: 32
    gracePeriod: 1h

  - name: mongo-root-password
    type: db-credential
    intervalDays: 90
    method: automated
    lambdaArn: 'arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:health-watchers-secret-rotation'
    consumers: []
    minLength: 32
    gracePeriod: 1h

  - name: jwt-secret
    type: signing-key
    intervalDays: 90
    method: automated # publish new kid, keep previous for graceDays
    consumers: [health-watchers-api]
    reloadStrategy: rolling-restart
    overlap: true
    minLength: 48
    gracePeriod: 24h

  - name: refresh-token-pepper
    type: signing-key
    intervalDays: 180
    method: automated
    consumers: [health-watchers-api]
    overlap: true
    minLength: 48
    gracePeriod: 24h

  - name: redis-password
    type: cache-credential
    intervalDays: 90
    method: automated
    consumers: [health-watchers-api, health-watchers-web]
    reloadStrategy: rolling-restart
    minLength: 32
    gracePeriod: 5m

  - name: stellar-keys
    type: keypair
    intervalDays: 180
    method: manual # requires on-chain account merge / signer swap
    consumers: [health-watchers-stellar-service]
    runbook: monitoring/runbooks/STELLAR_KEYPAIR_DECRYPTION_FAILURE.md
    gracePeriod: n/a

  - name: api-keys
    type: third-party
    intervalDays: 60
    method: semi-automated # provider API where available, else manual
    consumers: [health-watchers-api]
    gracePeriod: provider-dependent

  - name: backup-encryption-key
    type: data-key
    intervalDays: 365
    method: manual # re-encrypt existing archives on rotation
    consumers: [backup-cronjob, dr-tooling]
    runbook: docs/BACKUP_VERIFICATION.md
    gracePeriod: n/a

  - name: smtp-credentials
    type: third-party
    intervalDays: 180
    method: semi-automated
    consumers: [health-watchers-api]
    gracePeriod: 1h

  - name: cdn-api-token
    type: third-party
    intervalDays: 90
    method: semi-automated
    consumers: [health-watchers-web, ci-cache-invalidation]
    gracePeriod: 5m
