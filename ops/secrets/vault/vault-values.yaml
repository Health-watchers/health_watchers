# Helm values for a production HashiCorp Vault install.
#   helm upgrade --install vault hashicorp/vault -n vault -f this-file
#
# Provides: HA via Integrated Storage (Raft), KMS auto-unseal, file audit device,
# TLS everywhere, and DR replication to the secondary region (Enterprise).
# This is the self-hosted alternative to AWS Secrets Manager — see
# docs/SECRETS_MANAGEMENT.md.

global:
  tlsDisable: false

injector:
  # ESO is the sync path of record; the sidecar injector stays off to keep a
  # single, auditable injection mechanism.
  enabled: false

server:
  image:
    repository: hashicorp/vault
    tag: '1.17.2'

  # 3 AZ spread, 5 replicas for a Raft quorum that tolerates 2 node losses.
  ha:
    enabled: true
    replicas: 5
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address       = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file  = "/vault/userconfig/vault-tls/tls.key"
          tls_min_version = "tls12"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
          }
        }

        # KMS auto-unseal: no operator-held unseal keys, keys never on disk.
        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "alias/health-watchers-vault-unseal"
        }

        # Enterprise DR replication target lives in eu-west-1.
        replication {
          resolver_discover_servers = true
        }

        service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: gp3-encrypted

  auditStorage:
    enabled: true
    size: 20Gi
    storageClass: gp3-encrypted

  extraEnvironmentVars:
    VAULT_ADDR: https://127.0.0.1:8200

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ template "vault.name" . }}
              component: server
          topologyKey: topology.kubernetes.io/zone

  # Enable a file audit device on first boot (also enable stdout via CLI so logs
  # ship to the ELK pipeline).
  postStart:
    - /bin/sh
    - -c
    - |
      sleep 10
      vault audit enable file file_path=/vault/audit/audit.log || true

  standalone:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

csi:
  enabled: false

serverTelemetry:
  serviceMonitor:
    enabled: true
  prometheusRules:
    enabled: true
    rules:
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Vault instance {{ $labels.instance }} is sealed'
      - alert: VaultLeadershipLost
        expr: vault_raft_leader == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'No Raft leader for 5m'
