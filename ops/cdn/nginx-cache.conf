# Origin nginx configuration for Health Watchers — compression, pre-compressed
# asset serving, per-location Cache-Control, a small micro-cache for public HTML,
# and stale-if-error. Include this from the web container's server block:
#
#   server {
#     ...
#     include /etc/nginx/conf.d/hw-cache.conf;
#   }
#
# The CDN sits in front of this; these headers/settings ensure cache misses and
# any non-CDN traffic are still fast and correct.

# ── Compression ───────────────────────────────────────────────────────────
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/rss+xml
    application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

# Brotli (requires the ngx_brotli module in the image)
brotli            on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_static     on;    # serve pre-built .br when present
brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

gzip_static       on;    # serve pre-built .gz when present

# ── Micro-cache for public, cookieless HTML ───────────────────────────────
proxy_cache_path /var/cache/nginx/hw levels=1:2 keys_zone=hw_html:20m
                 max_size=500m inactive=10m use_temp_path=off;

map $http_cookie $hw_no_cache {
    default        0;
    ~hw_session    1;   # never micro-cache an authenticated response
}

# ── Immutable hashed build assets ────────────────────────────────────────
location ~* ^/_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Cache-Config "hw-immutable" always;
    access_log off;
    try_files $uri =404;
}

location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|eot|otf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# ── Images ──────────────────────────────────────────────────────────────
location ~* ^/(images|_next/image) {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header Vary "Accept" always;
    try_files $uri @app;
}

# ── Public marketing HTML (micro-cached) ────────────────────────────────
location = / {
    proxy_cache            hw_html;
    proxy_cache_bypass     $hw_no_cache;
    proxy_no_cache         $hw_no_cache;
    proxy_cache_valid      200 60s;
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock       on;
    add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=86400" always;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://app_upstream;
}

# ── Reference API data ─────────────────────────────────────────────────
location ~* ^/api/v1/(icd10|catalog) {
    add_header Cache-Control "public, s-maxage=300" always;
    proxy_pass http://api_upstream;
}

# ── Everything else under /api — never cache ──────────────────────────
location /api/ {
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://api_upstream;
}

# ── App shell — authenticated, never cache ────────────────────────────
location /app/ {
    add_header Cache-Control "private, no-store" always;
    proxy_pass http://app_upstream;
}

location @app {
    proxy_pass http://app_upstream;
}

# Reject origin requests that did not come through the CDN (defence in depth;
# the ALB listener rule enforces the same check).
if ($http_x_cdn_origin_verify != "REPLACE_WITH_SECRET") {
    set $hw_direct 1;
}
# (wire $hw_direct to a 403 in the server block if direct origin access is disallowed)
