version: 2
updates:
  # Root workspace (shared tooling, lint, test, build dependencies)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'automated'
      - 'workspace:root'
    # Group minor & patch updates into a single PR per dependency-type so the
    # security-scan job runs once per batch instead of per-package.
    groups:
      root-production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      root-development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Major bumps are opened individually and never auto-merged (manual review).
    # Critical packages (AWS SDK, Stellar SDK, security tooling) are always
    # opened individually so they require manual review, never auto-merged.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'aws-sdk'
      - dependency-name: '@aws-sdk/*'
      - dependency-name: 'stellar-sdk'
      - dependency-name: '@stellar/*'
      - dependency-name: 'helmet'
      - dependency-name: 'bcrypt'
      - dependency-name: 'bcryptjs'
      - dependency-name: 'jsonwebtoken'
      - dependency-name: 'passport'
      - dependency-name: 'passport-*'
      - dependency-name: 'express-rate-limit'
      - dependency-name: 'csurf'
      - dependency-name: 'crypto-js'
      - dependency-name: 'node-forge'
      - dependency-name: 'openpgp'
      - dependency-name: 'jose'
      - dependency-name: 'jwks-rsa'
      - dependency-name: 'oauth*'
      - dependency-name: 'openid-client'
      - dependency-name: 'snyk'
      - dependency-name: 'npm-audit-*'
      - dependency-name: 'audit-ci'
      - dependency-name: 'eslint-plugin-security'
      - dependency-name: 'semgrep'
      - dependency-name: 'trivy'

