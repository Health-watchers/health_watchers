name: Kyverno Setup & Policy Sync

on:
  push:
    branches: [main]
    paths:
      - 'k8s/kyverno-policies/**'
      - '.github/workflows/kyverno-setup.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-policies:
    name: Validate Kyverno Policies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.11.4/kyverno-cli_v1.11.4_linux_x86_64.tar.gz
          tar -xzf kyverno-cli_v1.11.4_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Validate policy syntax
        run: |
          kyverno validate k8s/kyverno-policies/*.yaml
          echo "✅ Policy syntax validation passed"

      - name: Test policies with sample resources
        run: |
          # Create test pod manifest
          cat > test-pod.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: test-api
            namespace: health-watchers
            labels:
              app.kubernetes.io/name: health-watchers-api
          spec:
            containers:
              - name: api
                image: ghcr.io/test/health-watchers-api:main
          EOF
          
          # Test policy application (dry run)
          kyverno apply k8s/kyverno-policies/verify-image-signatures.yaml \
            --resource test-pod.yaml \
            || echo "⚠️  Policy would block unsigned images (expected behavior)"

      - name: Generate policy documentation
        run: |
          echo "# Kyverno Policy Report" > policy-report.md
          echo "" >> policy-report.md
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> policy-report.md
          echo "" >> policy-report.md
          
          for policy in k8s/kyverno-policies/*.yaml; do
            echo "## $(basename $policy)" >> policy-report.md
            echo '```yaml' >> policy-report.md
            grep -A 10 "metadata:" "$policy" | head -15 >> policy-report.md
            echo '```' >> policy-report.md
            echo "" >> policy-report.md
          done

      - name: Upload policy report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: kyverno-policy-report
          path: policy-report.md
          retention-days: 30

  sync-policies-staging:
    name: Sync Policies to Staging
    runs-on: ubuntu-latest
    needs: [validate-policies]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check if Kyverno is installed
        id: kyverno-check
        run: |
          if kubectl get namespace kyverno 2>/dev/null; then
            echo "installed=true" >> $GITHUB_OUTPUT
            echo "✅ Kyverno is already installed"
          else
            echo "installed=false" >> $GITHUB_OUTPUT
            echo "⚠️  Kyverno is not installed"
          fi

      - name: Install Kyverno
        if: steps.kyverno-check.outputs.installed == 'false'
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          
          helm install kyverno kyverno/kyverno \
            --namespace kyverno \
            --create-namespace \
            --set replicaCount=1 \
            --set resources.limits.memory=512Mi \
            --set resources.requests.memory=256Mi \
            --wait \
            --timeout 5m
          
          echo "✅ Kyverno installed successfully"

      - name: Apply policies
        run: |
          kubectl apply -f k8s/kyverno-policies/verify-image-signatures.yaml
          echo "✅ Policies applied to staging"

      - name: Verify policies
        run: |
          echo "Installed ClusterPolicies:"
          kubectl get clusterpolicy
          
          echo ""
          echo "Policy status:"
          kubectl get clusterpolicy -o custom-columns=NAME:.metadata.name,BACKGROUND:.spec.background,ACTION:.spec.validationFailureAction,READY:.status.ready

      - name: Generate policy report
        run: |
          # Wait for policy reports to be generated
          sleep 30
          
          echo "Policy Reports:"
          kubectl get policyreport -A || echo "No policy reports yet"

  sync-policies-production:
    name: Sync Policies to Production
    runs-on: ubuntu-latest
    needs: [validate-policies, sync-policies-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: '3.14.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check if Kyverno is installed
        id: kyverno-check
        run: |
          if kubectl get namespace kyverno 2>/dev/null; then
            echo "installed=true" >> $GITHUB_OUTPUT
            echo "✅ Kyverno is already installed"
          else
            echo "installed=false" >> $GITHUB_OUTPUT
            echo "⚠️  Kyverno is not installed"
          fi

      - name: Install Kyverno
        if: steps.kyverno-check.outputs.installed == 'false'
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          
          helm install kyverno kyverno/kyverno \
            --namespace kyverno \
            --create-namespace \
            --set replicaCount=3 \
            --set resources.limits.memory=1Gi \
            --set resources.requests.memory=512Mi \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=1 \
            --wait \
            --timeout 5m
          
          echo "✅ Kyverno installed successfully"

      - name: Apply policies
        run: |
          kubectl apply -f k8s/kyverno-policies/verify-image-signatures.yaml
          echo "✅ Policies applied to production"

      - name: Verify policies
        run: |
          echo "Installed ClusterPolicies:"
          kubectl get clusterpolicy
          
          echo ""
          echo "Policy status:"
          kubectl get clusterpolicy -o custom-columns=NAME:.metadata.name,BACKGROUND:.spec.background,ACTION:.spec.validationFailureAction,READY:.status.ready

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🔒 *Kyverno policies updated in production*\n✅ Image signature verification is now active\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        continue-on-error: true
