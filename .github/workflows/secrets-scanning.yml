name: Secrets Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Full repo scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks — Scan for Leaked Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch full history so gitleaks can diff previous commits
          fetch-depth: 0

      - name: Run Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff8c960ee06dc02fe59e6aedd41c3b9e06e84fb8 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set GITLEAKS_LICENSE if you have a commercial licence
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          # On PRs only scan the diff; on push/schedule scan the full repo
          args: >-
            --config=.gitleaks.toml
            --report-format=sarif
            --report-path=gitleaks-report.sarif
            ${{ github.event_name == 'pull_request' && '--log-opts=origin/main..HEAD' || '' }}

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1b1aada464948af03b950b1073b8ee5becc10c3c # v3.24.9
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
        continue-on-error: true

      - name: Upload raw report artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Annotate PR with leak summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdae # v7.0.1
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ⚠️ Secrets Detected by Gitleaks',
                '',
                'Gitleaks found potential secrets in this PR.',
                'Please review the **Security → Code scanning alerts** tab for details.',
                '',
                '**Next steps:**',
                '1. Remove or rotate the exposed secret immediately.',
                '2. If it is a false positive, add an inline `gitleaks:allow` comment or update `.gitleaks.toml`.',
                '3. Consider using [git-filter-repo](https://github.com/newren/git-filter-repo) to purge secrets from history.',
              ].join('\n'),
            });
