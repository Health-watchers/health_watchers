name: Docker Build & Push

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: health-watchers

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for cosign keyless signing

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile.prod
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile.prod
            context: .
          - service: stellar-service
            dockerfile: apps/stellar-service/Dockerfile.prod
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@ab9d16d4b419c9d1a02df5213fa0ebe965ca5a57 # v0.17.10

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@70db1e3ad0e0e856e5dac89eb13db77d754c74c4 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.0.1
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            BUILDKIT_INLINE_CACHE=1

      - name: Generate SBOM with Syft (SPDX format)
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"
          IMAGE_DIGEST="${{ steps.build-push.outputs.digest }}"
          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          
          echo "Generating SBOM for ${IMAGE_REF}"
          syft ${IMAGE_REF} -o spdx-json=sbom-${{ matrix.service }}.spdx.json
          
          echo "✅ SBOM generated: sbom-${{ matrix.service }}.spdx.json"

      - name: Sign image and attest SBOM with cosign
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "true"  # Enable keyless signing
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"
          IMAGE_DIGEST="${{ steps.build-push.outputs.digest }}"
          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          
          echo "Signing image: ${IMAGE_REF}"
          cosign sign --yes ${IMAGE_REF}
          
          echo "Attesting SBOM to image"
          cosign attest --yes --predicate sbom-${{ matrix.service }}.spdx.json --type spdx ${IMAGE_REF}
          
          echo "✅ Image signed and SBOM attested"

      - name: Verify signature
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"
          IMAGE_DIGEST="${{ steps.build-push.outputs.digest }}"
          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          
          echo "Verifying signature for ${IMAGE_REF}"
          cosign verify ${IMAGE_REF} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          
          echo "✅ Signature verification successful"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@662472033e021a538e194dcf7d1d6e3f148182ef # v3.26.0
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'
        continue-on-error: true

      - name: Upload SBOM as artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

  build-validation:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: [build-images]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-images.result }}" = "failure" ]; then
            echo "❌ Docker build failed"
            exit 1
          else
            echo "✅ Docker build successful"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Docker images built and scanned successfully!'
            })
        continue-on-error: true

  attach-sbom-to-release:
    name: Attach SBOMs to Release
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all SBOMs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: sbom-*
          path: sboms/

      - name: Attach SBOMs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sboms/**/*.spdx.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
