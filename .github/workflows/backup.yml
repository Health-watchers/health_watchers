name: MongoDB Backup

on:
  schedule:
    # Full backup daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Oplog archive every 5 minutes for PITR
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type to run'
        type: choice
        options:
          - full
          - oplog
          - both
        default: both
      verify:
        description: 'Run restore verification after backup'
        type: boolean
        default: false
      legacy_backup:
        description: 'Run the legacy GitHub Actions backup (primary backups run as k8s CronJobs)'
        type: boolean
        default: false

# Primary backups (full + oplog/PITR) now run as Kubernetes CronJobs in
# k8s/backup/backup-cronjobs.yaml. GitHub Actions is retained for verification
# only. The legacy backup jobs below are gated behind `legacy_backup` and are
# skipped by default so they no longer fail on schedule.

env:
  # MongoDB Database Tools version installed from the official apt repo.
  MONGODB_TOOLS_VERSION: '100.9.4'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  preflight:
    name: Preflight (required secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        env:
          # Secrets are passed via env indirection so they are never evaluated
          # directly inside `if:` expressions (which cannot access `secrets`).
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
        run: |
          missing=()
          [[ -z "${MONGO_URI}" ]] && missing+=("MONGO_URI")
          [[ -z "${BACKUP_BUCKET}" ]] && missing+=("BACKUP_BUCKET")
          [[ -z "${BACKUP_ENCRYPTION_KEY}" ]] && missing+=("BACKUP_ENCRYPTION_KEY")
          [[ -z "${AWS_ROLE_ARN}" ]] && missing+=("AWS_BACKUP_ROLE_ARN")
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Backup secrets not configured (${missing[*]}); skipping backup jobs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  full-backup:
    name: Full MongoDB Backup (legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    if: |
      needs.preflight.outputs.ready == 'true' &&
      (github.event.inputs.legacy_backup == 'true' || github.event.inputs.backup_type == 'full' || github.event.inputs.backup_type == 'both')

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y "mongodb-database-tools=${MONGODB_TOOLS_VERSION}"
          mongodump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          role-session-name: gha-mongodb-full-backup
          aws-region: ${{ env.AWS_REGION }}

      - name: Run backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_RETENTION_DAYS: 30
        run: |
          ARGS=""
          if [[ "${{ github.event.inputs.verify }}" == "true" ]]; then
            ARGS="--verify"
          fi
          bash scripts/backup-mongodb.sh $ARGS

      - name: Notify on failure
        if: failure()
        continue-on-error: false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "::error::BACKUP_ALERT_WEBHOOK_URL secret is not set; cannot send failure notification."
            exit 1
          fi
          payload=$(jq -n --arg text "🚨 Full MongoDB backup failed: ${RUN_URL}" '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"

  oplog-backup:
    name: MongoDB Oplog Archive (PITR, legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: |
      needs.preflight.outputs.ready == 'true' &&
      (github.event.inputs.legacy_backup == 'true' || github.event.inputs.backup_type == 'oplog' || github.event.inputs.backup_type == 'both')

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y "mongodb-database-tools=${MONGODB_TOOLS_VERSION}"
          mongodump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          role-session-name: gha-mongodb-oplog-backup
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive oplog segment
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          OPLOG_INTERVAL_SECONDS: 300
        run: bash scripts/backup-mongodb-oplog.sh

      - name: Notify on failure
        if: failure()
        continue-on-error: false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "::error::BACKUP_ALERT_WEBHOOK_URL secret is not set; cannot send failure notification."
            exit 1
          fi
          payload=$(jq -n --arg text "🚨 MongoDB oplog archive (PITR) failed: ${RUN_URL}" '{text: $text}')
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"

  weekly-verify:
    name: Weekly Backup Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: preflight
    if: |
      needs.preflight.outputs.ready == 'true' &&
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 2 * * 0')

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y "mongodb-database-tools=${MONGODB_TOOLS_VERSION}"
          mongodump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          role-session-name: gha-mongodb-backup-verify
          aws-region: ${{ env.AWS_REGION }}

      - name: Run backup with verification
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: bash scripts/backup-mongodb.sh --verify
