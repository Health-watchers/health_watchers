name: Secret Rotation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      secret_name:
        description: 'Name of the secret to rotate (e.g. jwt-secret, stellar-keypair, mongodb-credentials)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate only, do not rotate)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: secret-rotation-${{ inputs.environment }}-${{ inputs.secret_name }}
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate ${{ inputs.secret_name }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Protected GitHub Environment requiring manual approval before this job runs.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.verify.outputs.verification_url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SECRET_NAME: ${{ inputs.secret_name }}
      ENVIRONMENT: ${{ inputs.environment }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROTATION_ROLE_ARN }}
          role-session-name: secret-rotation-${{ inputs.environment }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query 'Arn' --output text

      - name: Validate secrets configuration
        run: |
          set -euo pipefail
          chmod +x scripts/secrets/validate-secrets.sh
          ./scripts/secrets/validate-secrets.sh

      - name: Confirm secret exists
        run: |
          set -euo pipefail
          aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query 'ARN' --output text >/dev/null
          echo "Secret '$SECRET_NAME' found in $ENVIRONMENT."

      - name: Rotate secret
        id: rotate
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled: skipping rotation."
            echo "rotated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -x scripts/secrets/rotate-secret.sh ]; then
            chmod +x scripts/secrets/rotate-secret.sh
            ./scripts/secrets/rotate-secret.sh "$SECRET_NAME"
          else
            aws secretsmanager rotate-secret --secret-id "$SECRET_NAME"
          fi
          echo "rotated=true" >> "$GITHUB_OUTPUT"

      - name: Wait for rotation to complete
        if: steps.rotate.outputs.rotated == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATUS=$(aws secretsmanager describe-secret \
              --secret-id "$SECRET_NAME" \
              --query 'RotationEnabled' --output text)
            if [ "$STATUS" = "True" ]; then
              echo "Rotation is enabled and configured."
              break
            fi
            echo "Waiting for rotation configuration ($i/30)..."
            sleep 10
          done

      - name: Verify rotation result
        id: verify
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: verification skipped."
            exit 0
          fi
          # Verify the secret is retrievable and has a recent version.
          # Never print the secret value itself.
          VERSION_ID=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query 'VersionId' --output text)
          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "None" ]; then
            echo "::error::Secret '$SECRET_NAME' has no retrievable version after rotation."
            exit 1
          fi
          echo "Secret '$SECRET_NAME' rotated successfully (version id present)."
          echo "verification_url=https://console.aws.amazon.com/secretsmanager/secret?name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Secret Rotation Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | $ENVIRONMENT |"
            echo "| Secret | $SECRET_NAME |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Rotated | ${{ steps.rotate.outputs.rotated }} |"
          } >> "$GITHUB_STEP_SUMMARY"