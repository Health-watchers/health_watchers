name: Mutation Testing

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/src/modules/auth/**'
      - 'apps/api/src/services/token-denylist.service.ts'
      - 'apps/api/stryker.config.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/src/modules/auth/**'
      - 'apps/api/src/services/token-denylist.service.ts'
      - 'apps/api/stryker.config.json'
  workflow_dispatch: # allow manual trigger

jobs:
  mutation-testing:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation --workspace=api
        env:
          JWT_ACCESS_TOKEN_SECRET: test-access-secret-32-chars-long!!
          JWT_REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-long!
          NODE_ENV: test
          API_PORT: 3001
        # Mutation testing is informational on PRs; only fail when the score
        # drops below the "break" threshold defined in stryker.config.json.
        continue-on-error: false

      - name: Upload mutation report (HTML)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutation-report
          path: |
            apps/api/reports/mutation/mutation.html
            apps/api/reports/mutation/mutation.json
          retention-days: 30

      - name: Analyze mutation results
        if: always()
        run: npm run test:mutation:analyze --workspace=api -- --threshold 80

      - name: Check auth module mutation score
        if: always()
        run: |
          if [ -f apps/api/reports/mutation/mutation.json ]; then
            node -e "
              const r = require('./apps/api/reports/mutation/mutation.json');
              const files = r.files || {};
              let authKilled = 0, authTotal = 0;
              
              for (const [path, fileData] of Object.entries(files)) {
                if (!path.includes('modules/auth')) continue;
                const mutants = fileData.mutants || [];
                for (const m of mutants) {
                  if (m.status !== 'NoCoverage' && m.status !== 'Ignored') {
                    authTotal++;
                    if (m.status === 'Killed' || m.status === 'Timeout') {
                      authKilled++;
                    }
                  }
                }
              }
              
              const authScore = authTotal > 0 ? Math.round((authKilled / authTotal) * 100) : 100;
              console.log('\\n═══════════════════════════════════════════');
              console.log('AUTH MODULE MUTATION SCORE: ' + authScore + '%');
              console.log('  Killed: ' + authKilled + '/' + authTotal);
              console.log('  Threshold: 80%');
              console.log('═══════════════════════════════════════════\\n');
              
              if (authScore < 80) {
                console.error('❌ FAIL: Auth module mutation score ' + authScore + '% is below 80% threshold');
                console.error('The auth module is security-critical and must maintain 80%+ mutation coverage.');
                process.exit(1);
              } else {
                console.log('✅ PASS: Auth module mutation score meets 80% threshold');
              }
            "
          else
            echo "No mutation report found."
            exit 1
          fi
