name: Secrets Rotation Check

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        type: choice
        options: [staging, production]
        default: production
      store:
        description: 'Secret store'
        type: choice
        options: [aws, vault]
        default: aws

concurrency:
  group: secrets-rotation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  rotation-check:
    name: Validate & report secret rotation status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["staging","production"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install tooling (yq, jq, bc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq bc
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Configure AWS credentials
        if: ${{ (github.event.inputs.store || 'aws') == 'aws' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_SECRETS_READONLY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Rotation status report
        id: report
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
        run: |
          set +e
          bash scripts/secrets/rotate-secret.sh \
            --env "${{ matrix.environment }}" \
            --store "${{ github.event.inputs.store || 'aws' }}" \
            --report | tee rotation-report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate secrets (format, strength, freshness)
        id: validate
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_RO_TOKEN }}
        run: |
          set +e
          bash scripts/secrets/validate-secrets.sh \
            --env "${{ matrix.environment }}" \
            --store "${{ github.event.inputs.store || 'aws' }}" \
            --json > validation-${{ matrix.environment }}.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat validation-${{ matrix.environment }}.json | jq .

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: secrets-rotation-${{ matrix.environment }}
          path: |
            rotation-report.txt
            validation-${{ matrix.environment }}.json
          retention-days: 30

      - name: Open incident issue on overdue / invalid secrets
        if: steps.report.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('rotation-report.txt') ? fs.readFileSync('rotation-report.txt','utf8') : '(no report)';
            const env = '${{ matrix.environment }}';
            const title = `🔐 Secrets rotation/validation failing for ${env}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'secrets,incident'
            });
            const body = [
              `The scheduled secrets rotation check failed for **${env}**.`,
              '',
              '```',
              report.slice(0, 5000),
              '```',
              '',
              `Rotation exit: ${{ steps.report.outputs.exit_code }} · Validation exit: ${{ steps.validate.outputs.exit_code }}`,
              '',
              `Remediate with \`scripts/secrets/rotate-secret.sh --env ${env} --secret <name>\`.`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['secrets','incident','devops'] });
            }

      - name: Fail the job if anything is overdue or invalid
        if: steps.report.outputs.exit_code != '0' || steps.validate.outputs.exit_code != '0'
        run: exit 1
