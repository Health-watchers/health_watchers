name: Docs — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-flight runs on the same ref
# so a rapid succession of pushes to main doesn't queue up multiple deploys.
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ── Build & link-check ──────────────────────────────────────────────────────
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so Docusaurus can read git metadata (last-modified dates)
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/docs

      # Docusaurus is configured with onBrokenLinks: 'throw' so this step
      # fails CI on any dangling internal link — enforcing the acceptance
      # criterion that the docs are always self-consistent.
      - name: Build docs (broken links → error)
        run: npm run build
        working-directory: apps/docs
        env:
          # Tell Docusaurus the production base URL so absolute links resolve
          # correctly in the built HTML.
          DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
          DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload built site as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: docs-build-${{ github.run_id }}
          path: apps/docs/build/
          retention-days: 7

  # ── Deploy to GitHub Pages (main branch only) ───────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    # Only deploy on pushes to main (not PRs, not other branches)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Grant the GITHUB_TOKEN the write permission needed to push to gh-pages
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download built docs
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b1c03be89bdae54 # v4.1.8
        with:
          name: docs-build-${{ github.run_id }}
          path: apps/docs/build/

      # peaceiris/actions-gh-pages pushes the build output to the gh-pages
      # branch, which GitHub Pages then serves automatically.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d231e62369c1bc259 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/build
          # Keep the cname file if a custom domain is configured
          keep_files: false
          commit_message: "docs: deploy ${{ github.sha }}"
