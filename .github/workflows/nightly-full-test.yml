name: Nightly Full Test Suite

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: 20

jobs:
  full-test-suite:
    name: Full Test Suite (All Packages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run all tests with coverage
        run: npx turbo run test:coverage --concurrency=2
        env:
          JWT_ACCESS_TOKEN_SECRET: test-access-secret-32-chars-long!!
          JWT_REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-long!
          STELLAR_NETWORK: testnet
          NODE_ENV: test
          API_PORT: 3001
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 30
      
      - name: Generate test summary
        if: always()
        run: |
          echo "# 🌙 Nightly Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f apps/api/coverage/coverage-summary.json ]; then
            API_COV=$(node -e "const c=require('./apps/api/coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "**API Coverage:** ${API_COV}%" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f apps/web/coverage/coverage-summary.json ]; then
            WEB_COV=$(node -e "const c=require('./apps/web/coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            echo "**Web Coverage:** ${WEB_COV}%" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ *Nightly test suite FAILED*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        continue-on-error: true

  security-headers-e2e:
    name: Comprehensive Security Headers Tests
    runs-on: ubuntu-latest
    needs: full-test-suite
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
      
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start API server
        run: |
          cd apps/api
          npm run build
          npm run start &
          sleep 10
        env:
          MONGO_URI: mongodb://admin:password123@localhost:27017/health_watchers?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_TOKEN_SECRET: test-access-secret-32-chars-long!!
          JWT_REFRESH_TOKEN_SECRET: test-refresh-secret-32-chars-long!
          NODE_ENV: production
          API_PORT: 3001
      
      - name: Start Web server
        run: |
          cd apps/web
          npm run build
          npm run start &
          sleep 10
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NODE_ENV: production
      
      - name: Wait for services
        run: |
          npx wait-on http://localhost:3000 http://localhost:3001/api/v1/health --timeout 60000
      
      - name: Run security headers E2E tests
        run: |
          cd apps/web
          npx playwright test e2e/security-headers.spec.ts --reporter=html
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-headers-test-results
          path: apps/web/playwright-report/
          retention-days: 30
