name: Contract Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

jobs:
  consumer-contract-tests:
    name: Consumer Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run consumer contract tests
        run: npm run test:contract:consumer
      - name: Publish consumer contracts to broker
        run: |
          npx pact-broker publish ./pacts \
            --consumer-app-version=${{ github.sha }} \
            --branch=${{ github.ref_name }} \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token=${{ env.PACT_BROKER_TOKEN }}

  provider-verification:
    name: Provider Contract Verification
    runs-on: ubuntu-latest
    needs: consumer-contract-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify provider against broker contracts
        run: npm run test:contract:provider
        env:
          PACT_PROVIDER_VERSION: ${{ github.sha }}
          PACT_PROVIDER_BRANCH: ${{ github.ref_name }}

  can-i-deploy:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    needs: provider-verification
    steps:
      - uses: actions/checkout@v4
      - name: Check for breaking changes before merge
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant health-watchers-web \
            --version=${{ github.sha }} \
            --to-environment=production \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token=${{ env.PACT_BROKER_TOKEN }}

  contract-report:
    name: Publish Contract Dashboard Report
    runs-on: ubuntu-latest
    needs: can-i-deploy
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Generate contract matrix report
        run: |
          npx pact-broker create-webhook \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-token=${{ env.PACT_BROKER_TOKEN }} \
            || true
          curl -sf "${PACT_BROKER_BASE_URL}/dashboard" \
            -H "Authorization: Bearer ${PACT_BROKER_TOKEN}" \
            -o contract-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: contract-dashboard-report
          path: contract-report.html
