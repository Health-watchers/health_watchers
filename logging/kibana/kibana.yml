# ============================================================
# Kibana Configuration — Health Watchers
# Issue: #1007 – Log Aggregation with ELK
# ============================================================

server.name: health-watchers-kibana
server.host: '0.0.0.0'
server.port: 5601

# Elasticsearch connection
elasticsearch.hosts: ['http://elasticsearch:9200']
elasticsearch.username: elastic
elasticsearch.password: changeme

# Security
xpack.security.enabled: true
xpack.encryptedSavedObjects.encryptionKey: '${KIBANA_ENCRYPTION_KEY:a-32-character-encryption-key!!}'

# Alerting (Watcher)
xpack.alerting.enabled: true

# Fleet / APM
xpack.fleet.enabled: false
apm.enabled: false

# Monitoring
monitoring.ui.enabled: true
monitoring.ui.elasticsearch.hosts: ['http://elasticsearch:9200']

# Saved objects import size
savedObjects.maxImportPayloadBytes: 26214400

# Session
xpack.security.session.idleTimeout: '1h'
xpack.security.session.lifespan: '8h'

# Logging
logging:
  appenders:
    console:
      type: console
      layout:
        type: json
  root:
    appenders: [console]
    level: warn
