# ============================================================
# Logstash Pipeline — Health Watchers
# Issue: #1007 – Log Aggregation with ELK
# ============================================================

input {
  # UDP syslog input
  udp {
    port => 5000
    type => "syslog"
  }

  # TCP reliable log delivery
  tcp {
    port => 5000
    type => "syslog"
    codec => line
  }

  # Beats (Filebeat / Metricbeat) input
  beats {
    port => 5044
  }

  # HTTP input for direct JSON log shipping
  http {
    port => 8080
    codec => json
  }
}

filter {
  # ── Timestamp normalisation ────────────────────────────────
  if ![@timestamp] {
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601", "UNIX_MS", "UNIX"]
        target => "@timestamp"
        timezone => "UTC"
      }
    }
  }

  # ── Set index name ─────────────────────────────────────────
  mutate {
    add_field => { "[@metadata][index_prefix]" => "health-watchers" }
  }

  # ── Parse JSON application logs ───────────────────────────
  if [type] == "api" or [type] == "stellar" or [fields][type] == "api" {
    if [message] =~ /^\s*\{/ {
      json {
        source  => "message"
        target  => "parsed"
        skip_on_invalid_json => true
      }

      if [parsed] {
        mutate {
          copy => {
            "[parsed][timestamp]"    => "timestamp"
            "[parsed][level]"        => "log_level"
            "[parsed][message]"      => "message"
            "[parsed][service]"      => "service"
            "[parsed][requestId]"    => "request_id"
            "[parsed][traceId]"      => "trace_id"
            "[parsed][userId]"       => "user_id"
            "[parsed][clinicId]"     => "clinic_id"
            "[parsed][method]"       => "http_method"
            "[parsed][path]"         => "http_path"
            "[parsed][status]"       => "http_status"
            "[parsed][durationMs]"   => "response_time_ms"
            "[parsed][error]"        => "error_message"
            "[parsed][userAgent]"    => "user_agent"
            "[parsed][ip]"           => "source_ip"
            "[parsed][auditAction]"  => "audit_action"
            "[parsed][auditResource]" => "audit_resource"
            "[parsed][auditOutcome]" => "audit_outcome"
          }
        }
        mutate { remove_field => ["parsed"] }
      }
    }
  }

  # ── Parse standard syslog ─────────────────────────────────
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
      keep_on_failure => true
    }
  }

  # ── Environment tag ───────────────────────────────────────
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:production}"
      "cluster"     => "${CLUSTER:primary}"
    }
  }

  # ── Classify log level ────────────────────────────────────
  if [log_level] {
    mutate { uppercase => ["log_level"] }
  }

  if [log_level] =~ /ERROR|CRITICAL|FATAL/ {
    mutate { add_field => { "is_error" => "true" } }
  } else {
    mutate { add_field => { "is_error" => "false" } }
  }

  # ── Response time bucket ──────────────────────────────────
  if [response_time_ms] {
    mutate { convert => { "response_time_ms" => "integer" } }

    if [response_time_ms] < 100 {
      mutate { add_field => { "response_time_bucket" => "fast" } }
    } else if [response_time_ms] < 500 {
      mutate { add_field => { "response_time_bucket" => "medium" } }
    } else if [response_time_ms] < 1000 {
      mutate { add_field => { "response_time_bucket" => "slow" } }
    } else {
      mutate { add_field => { "response_time_bucket" => "very_slow" } }
    }
  }

  # ── Geo-IP enrichment ─────────────────────────────────────
  if [source_ip] and [source_ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)/ {
    geoip {
      source => "source_ip"
      target => "geoip"
      fields => ["location", "country_code2", "city_name"]
    }
  }

  # ── Scrub sensitive data ──────────────────────────────────
  mutate {
    gsub => [
      "message", "(?i)(password|passwd|pwd)[\"']?\\s*[:=]\\s*[\"']?[^\"'\\s,}]+", "\\1=***",
      "message", "(?i)(token|bearer)[\"']?\\s*[:=]\\s*[\"']?[^\"'\\s,}]+",        "\\1=***",
      "message", "(?i)(secret|api_key|apikey)[\"']?\\s*[:=]\\s*[\"']?[^\"'\\s,}]+", "\\1=***",
      "message", "(?i)(authorization:\\s*bearer\\s+)[^\\s]+",                       "\\1***"
    ]
  }

  # ── Remove internal Logstash metadata ─────────────────────
  mutate { remove_field => ["host", "port"] }
}

output {
  # ── Primary Elasticsearch output ─────────────────────────
  elasticsearch {
    hosts        => ["http://elasticsearch:9200"]
    index        => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    user         => "${ELASTICSEARCH_USERNAME:elastic}"
    password     => "${ELASTIC_PASSWORD:changeme}"
    http_compression => true
    manage_template => false
    ilm_enabled  => false
  }

  # ── Critical errors → dedicated index for fast alerting ──
  if [is_error] == "true" and [log_level] in ["CRITICAL", "FATAL"] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "health-watchers-errors-critical-%{+YYYY.MM.dd}"
      user     => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme}"
      http_compression => true
    }
  }

  # ── HIPAA audit logs → separate index ────────────────────
  if [audit_action] {
    elasticsearch {
      hosts    => ["http://elasticsearch:9200"]
      index    => "health-watchers-audit-%{+YYYY.MM.dd}"
      user     => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme}"
      http_compression => true
    }
  }

  # ── Debug stdout (enable only during development) ─────────
  # stdout { codec => rubydebug }
}
