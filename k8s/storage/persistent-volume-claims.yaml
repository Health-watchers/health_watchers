# PersistentVolumeClaims for stateful components (#1255).
#
# `standalone-mongodb-data` is only for a single-node MongoDB Deployment. The
# production replica set (k8s/mongodb-replica-set-statefulset.yaml) manages its
# own PVCs via volumeClaimTemplates and does NOT use this claim.
#
# Set `storageClassName` to a class that exists in your cluster:
#   - AWS EKS:  gp3 (or a custom class)
#   - GKE:      premium-rwo
#   - AKS:      managed-csi-premium
# `backups` needs ReadWriteMany — use EFS / Filestore / Azure Files, or drop it
# and push backups straight to object storage from the backup CronJob.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: standalone-mongodb-data
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
