# ============================================================
# Kubernetes Audit Policy for Secrets Management
#
# Captures all access to Kubernetes Secrets and External Secrets
# resources for HIPAA audit trail compliance.
#
# Deploy: set --audit-policy-file to this file path on the
# API server, and point --audit-log-path to your log sink.
#
# Issue: #1008 – Secrets Management
# ============================================================

apiVersion: audit.k8s.io/v1
kind: Policy

# Do not log requests arriving at these stages
omitStages:
  - RequestReceived

rules:
  # ── Secrets — full request+response for mutations ───────────
  - level: RequestResponse
    resources:
      - group: ''
        resources: ['secrets']
    namespaces: ['health-watchers']
    verbs: ['create', 'update', 'patch', 'delete', 'deletecollection']

  # ── Secrets — metadata only for reads (avoids leaking values) ─
  - level: Metadata
    resources:
      - group: ''
        resources: ['secrets']
    namespaces: ['health-watchers']
    verbs: ['get', 'list', 'watch']

  # ── ExternalSecrets — full audit ────────────────────────────
  - level: RequestResponse
    resources:
      - group: 'external-secrets.io'
        resources:
          - 'externalsecrets'
          - 'secretstores'
          - 'clustersecretstores'
          - 'pushsecrets'
    namespaces: ['health-watchers']
    verbs: ['*']

  # ── SecretStore access from ESO service account ─────────────
  - level: RequestResponse
    resources:
      - group: ''
        resources: ['secrets']
    namespaces: ['health-watchers']
    users:
      - 'system:serviceaccount:health-watchers:health-watchers-sa'
      - 'system:serviceaccount:external-secrets-system:external-secrets'

  # ── RBAC changes to secrets roles ───────────────────────────
  - level: RequestResponse
    resources:
      - group: 'rbac.authorization.k8s.io'
        resources: ['roles', 'rolebindings', 'clusterroles', 'clusterrolebindings']
    namespaces: ['health-watchers']
    verbs: ['create', 'update', 'patch', 'delete']

  # ── ServiceAccount mutations (could affect IRSA/secret access) ─
  - level: RequestResponse
    resources:
      - group: ''
        resources: ['serviceaccounts']
    namespaces: ['health-watchers']
    verbs: ['create', 'update', 'patch', 'delete']

  # ── CronJob secret-rotator changes ──────────────────────────
  - level: RequestResponse
    resources:
      - group: 'batch'
        resources: ['cronjobs', 'jobs']
    namespaces: ['health-watchers']
    verbs: ['create', 'update', 'patch', 'delete']

  # ── ConfigMaps that store rotation config ───────────────────
  - level: RequestResponse
    resources:
      - group: ''
        resources: ['configmaps']
    namespaces: ['health-watchers']
    resourceNames: ['secret-rotation-config']
    verbs: ['*']

  # ── Default: metadata only for everything else ──────────────
  - level: Metadata
    omitStages:
      - RequestReceived
