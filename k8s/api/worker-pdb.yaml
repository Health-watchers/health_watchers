apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-worker-pdb
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: api-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-worker
  unhealthyPodEvictionPolicy: AlwaysAllow
