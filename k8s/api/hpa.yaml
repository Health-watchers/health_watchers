apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: api
    version: v1
  annotations:
    # Scaling policy: scale up aggressively (60s stabilization) to handle traffic spikes quickly.
    # Scale down conservatively (300s stabilization) to prevent thrashing during temporary dips.
    # CPU threshold 70%: balance between utilization and headroom for request bursts.
    # Memory threshold 80%: allows high utilization while leaving room before OOM.
    scaling.policy/cpu-threshold: "70"
    scaling.policy/memory-threshold: "80"
    scaling.policy/scaleup-stabilization: "60s"
    scaling.policy/scaledown-stabilization: "300s"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
