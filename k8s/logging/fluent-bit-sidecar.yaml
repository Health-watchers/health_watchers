# Fluent Bit logging sidecar (#1255).
#
# Ships structured application logs to a central sink (Elasticsearch / Loki /
# CloudWatch). Runs as a sidecar so log shipping shares the Pod lifecycle and
# survives node-level DaemonSet gaps.
#
# Wiring:
#   1. apply this ConfigMap
#   2. apply logging-sidecar-patch.yaml onto each Deployment you want shipped
#      (adds the sidecar container + a shared emptyDir at /var/log/app)
#   3. set LOG_FILE=/var/log/app/app.log in health-watchers-config so the app
#      also writes JSON logs to the shared volume (stdout is unaffected)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-sidecar-config
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/app/*.log
        Tag               app.*
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Parser            json

    [FILTER]
        Name          record_modifier
        Match         app.*
        Record        cluster health-watchers
        Record        pod_name ${POD_NAME}
        Record        namespace ${POD_NAMESPACE}

    [OUTPUT]
        Name          es
        Match         app.*
        Host          ${LOG_SINK_HOST}
        Port          ${LOG_SINK_PORT}
        Logstash_Format On
        Logstash_Prefix health-watchers
        Retry_Limit   5
        Suppress_Type_Name On
        tls           ${LOG_SINK_TLS}
  parsers.conf: |
    [PARSER]
        Name         json
        Format       json
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
