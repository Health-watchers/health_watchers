# Per-component ServiceAccounts + least-privilege RBAC (#1255).
#
# The shared `health-watchers` SA in rbac.yaml stays for backwards
# compatibility. New deployments should bind to the component SA below:
#   - api             → needs to read ConfigMaps/Secrets/Endpoints
#   - web             → no Kubernetes API access at all (token not mounted)
#   - stellar-service → no Kubernetes API access at all (token not mounted)
#   - redis           → no Kubernetes API access at all (token not mounted)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-watchers-api
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: api
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-watchers-web
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-watchers-stellar
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: stellar-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-watchers-redis
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: redis
automountServiceAccountToken: false
---
# API needs read-only access to its own config + service discovery data.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: health-watchers-api
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: health-watchers-api
  namespace: health-watchers
  labels:
    app.kubernetes.io/name: health-watchers
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: health-watchers-api
subjects:
  - kind: ServiceAccount
    name: health-watchers-api
    namespace: health-watchers
