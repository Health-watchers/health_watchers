version: '3.8'

# ============================================================
# Production Overrides for Health Watchers
#
# This file contains production-specific configurations that
# override the base docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile core up
#
# Key differences from development:
# - Production Docker images (Dockerfile.prod)
# - Stricter restart policies (always)
# - Healthchecks enabled
# - Production environment variables
# - No volume mounts for hot-reloading
# - Resource limits enforced
# ============================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: health-watchers-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: health_watchers
    volumes:
      - mongodb_prod_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - health-watchers-prod

  redis:
    image: redis:7.2-alpine
    container_name: health-watchers-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - health-watchers-prod

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: health-watchers-api-prod
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 3001
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-mainnet}
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY}
      STELLAR_PUBLIC_KEY: ${STELLAR_PUBLIC_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SAMPLING_RATE: ${OTEL_SAMPLING_RATE:-0.1}
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
    volumes: []  # Remove dev volumes
    command: npm start --workspace=api
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - health-watchers-prod

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STELLAR_NETWORK: ${STELLAR_NETWORK:-mainnet}
    container_name: health-watchers-web-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    volumes: []  # Remove dev volumes
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - health-watchers-prod

  stellar-service:
    build:
      context: .
      dockerfile: apps/stellar-service/Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: health-watchers-stellar-prod
    restart: always
    environment:
      NODE_ENV: production
      STELLAR_NETWORK: ${STELLAR_NETWORK:-mainnet}
      STELLAR_SECRET_KEY: ${STELLAR_SECRET_KEY}
      STELLAR_PUBLIC_KEY: ${STELLAR_PUBLIC_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SAMPLING_RATE: ${OTEL_SAMPLING_RATE:-0.1}
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
    volumes: []  # Remove dev volumes
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3002/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - health-watchers-prod

  # Production monitoring with resource limits
  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  grafana:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  alertmanager:
    restart: always

volumes:
  mongodb_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  health-watchers-prod:
    driver: bridge
