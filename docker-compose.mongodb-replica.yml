# ============================================================
# MongoDB Replica Set Configuration
#
# High Availability setup with automatic failover.
# 1 Primary + 2 Secondaries + 1 Arbiter + Prometheus Exporter
#
# Issue: #1009 – Database Replication
# ============================================================

version: '3.8'

services:
  # Primary MongoDB instance
  mongodb-primary:
    image: mongo:7.0
    container_name: health-watchers-mongodb-primary
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: health_watchers
    command: >
      mongod
        --replSet rs0
        --bind_ip_all
        --auth
        --keyFile /data/keyfile/mongodb-keyfile
        --oplogSize 1024
        --wiredTigerCacheSizeGB 1
    volumes:
      - mongodb_primary_data:/data/db
      - mongodb_keyfile:/data/keyfile:ro
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./k8s/mongodb-replica-set-init.js:/scripts/replica-set-init.js:ro
    ports:
      - '27017:27017'
    healthcheck:
      test: >
        echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin
        -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - health-watchers-db

  # Secondary MongoDB instance 1
  mongodb-secondary-1:
    image: mongo:7.0
    container_name: health-watchers-mongodb-secondary-1
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: >
      mongod
        --replSet rs0
        --bind_ip_all
        --auth
        --keyFile /data/keyfile/mongodb-keyfile
        --oplogSize 1024
        --wiredTigerCacheSizeGB 1
    volumes:
      - mongodb_secondary_1_data:/data/db
      - mongodb_keyfile:/data/keyfile:ro
    ports:
      - '27018:27017'
    depends_on:
      mongodb-primary:
        condition: service_healthy
    healthcheck:
      test: >
        echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin
        -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - health-watchers-db

  # Secondary MongoDB instance 2
  mongodb-secondary-2:
    image: mongo:7.0
    container_name: health-watchers-mongodb-secondary-2
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: >
      mongod
        --replSet rs0
        --bind_ip_all
        --auth
        --keyFile /data/keyfile/mongodb-keyfile
        --oplogSize 1024
        --wiredTigerCacheSizeGB 1
    volumes:
      - mongodb_secondary_2_data:/data/db
      - mongodb_keyfile:/data/keyfile:ro
    ports:
      - '27019:27017'
    depends_on:
      mongodb-primary:
        condition: service_healthy
    healthcheck:
      test: >
        echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin
        -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - health-watchers-db

  # Arbiter — tie-breaking votes only, no data storage
  mongodb-arbiter:
    image: mongo:7.0
    container_name: health-watchers-mongodb-arbiter
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: >
      mongod
        --replSet rs0
        --bind_ip_all
        --auth
        --keyFile /data/keyfile/mongodb-keyfile
    volumes:
      - mongodb_arbiter_data:/data/db
      - mongodb_keyfile:/data/keyfile:ro
    ports:
      - '27020:27017'
    depends_on:
      mongodb-primary:
        condition: service_healthy
    healthcheck:
      test: >
        echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin
        -u ${MONGO_ROOT_USERNAME} -p ${MONGO_ROOT_PASSWORD} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - health-watchers-db

  # One-shot replica set initializer
  mongodb-replica-init:
    image: mongo:7.0
    container_name: health-watchers-mongodb-replica-init
    restart: 'no'
    depends_on:
      mongodb-primary:
        condition: service_healthy
      mongodb-secondary-1:
        condition: service_healthy
      mongodb-secondary-2:
        condition: service_healthy
      mongodb-arbiter:
        condition: service_healthy
    volumes:
      - ./k8s/mongodb-replica-set-init.js:/scripts/replica-set-init.js:ro
    command: >
      mongosh mongodb-primary:27017/admin
        -u ${MONGO_ROOT_USERNAME}
        -p ${MONGO_ROOT_PASSWORD}
        /scripts/replica-set-init.js
    networks:
      - health-watchers-db

  # Keyfile generator — run once to create shared keyfile
  mongodb-keyfile-init:
    image: mongo:7.0
    container_name: health-watchers-mongodb-keyfile-init
    restart: 'no'
    command: >
      bash -c "
        if [ ! -f /data/keyfile/mongodb-keyfile ]; then
          openssl rand -base64 756 > /data/keyfile/mongodb-keyfile &&
          chmod 400 /data/keyfile/mongodb-keyfile &&
          chown 999:999 /data/keyfile/mongodb-keyfile &&
          echo 'Keyfile created';
        else
          echo 'Keyfile already exists';
        fi
      "
    volumes:
      - mongodb_keyfile:/data/keyfile
    networks:
      - health-watchers-db

  # MongoDB Exporter — Prometheus metrics for replica set
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: health-watchers-mongodb-exporter
    restart: always
    environment:
      MONGODB_URI: >-
        mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb-primary:27017/admin?authSource=admin&replicaSet=rs0
    ports:
      - '9216:9216'
    command:
      - '--mongodb.uri=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb-primary:27017/admin?authSource=admin&replicaSet=rs0'
      - '--collect-all'
      - '--compatible-mode'
      - '--log.level=warn'
    depends_on:
      mongodb-primary:
        condition: service_healthy
    networks:
      - health-watchers-db
      - health-watchers-monitoring
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9216/metrics']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mongodb_primary_data:
    driver: local
  mongodb_secondary_1_data:
    driver: local
  mongodb_secondary_2_data:
    driver: local
  mongodb_arbiter_data:
    driver: local
  mongodb_keyfile:
    driver: local

networks:
  health-watchers-db:
    driver: bridge
  # Share with monitoring stack so Prometheus can scrape the exporter
  health-watchers-monitoring:
    external: true
    name: health-watchers-monitoring
