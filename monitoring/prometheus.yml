global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'health-watchers'
    environment: '${ENVIRONMENT:-production}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'recording-rules.yml'
  - 'alerts.yml'
  - 'alerts-application.yml'
  - 'alerts-payments.yml'
  - 'alerts-security.yml'
  - 'alerts-business.yml'
  - 'alerts-database-replication.yml'
  - 'alerts-database-pool.yml'
  - 'alerts-secrets.yml'
  - 'alerts-disaster-recovery.yml'
  - 'alerts-backup.yml'
  - 'alerts-cost.yml'
  - 'alerts-cdn.yml'
  - 'alerts-stellar.yml'
  - 'alerts-certificates.yml'

scrape_configs:
  # Health Watchers API
  - job_name: 'health-watchers-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: /metrics
    basic_auth:
      username: '${METRICS_USERNAME}'
      password: '${METRICS_PASSWORD}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Stellar Service
  - job_name: 'health-watchers-stellar'
    static_configs:
      - targets: ['stellar-service:3002']
    metrics_path: /metrics
    basic_auth:
      username: '${METRICS_USERNAME}'
      password: '${METRICS_PASSWORD}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # MongoDB Exporter (Replica Set metrics)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          component: 'database'
          replset: 'rs0'
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'

  # AlertManager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          component: 'monitoring'

  # Node Exporter (host metrics — optional, if node-exporter is deployed)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'
    honor_labels: true

  # cert-manager controller metrics (certificate expiry / renewal).
  # NOTE: the target host depends on how cert-manager is installed. In the
  # docker-compose stack cert-manager is not deployed by default, so this job
  # will report as down until a cert-manager instance is reachable. Without it
  # the certmanager_certificate_* metrics used by alerts-certificates.yml are
  # never scraped.
  - job_name: 'cert-manager'
    static_configs:
      - targets: ['cert-manager:9402']
        labels:
          component: 'certificates'
    metrics_path: /metrics
