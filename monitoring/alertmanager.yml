# ============================================================
# AlertManager Configuration
#
# Handles alert routing, grouping, and notification delivery
# for Health Watchers.
#
# Issue: #1006 – Monitoring and Alerting Setup
# ============================================================

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_smarthost: '${SMTP_SERVER}:${SMTP_PORT}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    # Critical alerts — immediate PagerDuty escalation
    - matchers:
        - severity = critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 4h
      routes:
        # Security alerts — also notify security team
        - matchers:
            - alertname =~ "StellarKeypairDecryptionFailure|UnauthorisedAccess"
          receiver: 'security-team'
          continue: false

    # Warning alerts — email notification
    - matchers:
        - severity = warning
      receiver: 'email-alerts'
      group_wait: 2m
      repeat_interval: 24h

    # Database replication alerts — DB team channel
    - matchers:
        - component = database
      receiver: 'database-team'
      continue: true

    # Info alerts — swallow
    - matchers:
        - severity = info
      receiver: 'null'

inhibit_rules:
  # Inhibit warning if critical is firing for same alert/service
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'cluster', 'service']

  # Inhibit info if warning is firing
  - source_matchers:
      - severity = warning
    target_matchers:
      - severity = info
    equal: ['alertname', 'cluster', 'service']

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#alerts-general'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Labels:* {{ range .Labels.SortedPairs }} {{ .Name }}={{ .Value }}{{ end }}
          {{ end }}

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .Alerts.Firing | len }} firing'
        client_url: '{{ .ExternalURL }}'
        details:
          cluster: '{{ .GroupLabels.cluster }}'
          service: '{{ .GroupLabels.service }}'

  - name: 'email-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        headers:
          Subject: '[{{ .GroupLabels.severity | toUpper }}] {{ .GroupLabels.alertname }}'
        html: |
          <h2>{{ .GroupLabels.alertname }}</h2>
          {{ range .Alerts }}
          <p><strong>{{ .Annotations.summary }}</strong></p>
          <p>{{ .Annotations.description }}</p>
          {{ end }}

  - name: 'security-team'
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: '🔒 SECURITY ALERT: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    email_configs:
      - to: '${SECURITY_TEAM_EMAIL}'
        headers:
          Subject: '[SECURITY CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'database-team'
    slack_configs:
      - channel: '#database-alerts'
        send_resolved: true
        title: '🗄️ DB Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

  - name: 'null'
