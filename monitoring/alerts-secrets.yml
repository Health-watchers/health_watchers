groups:
  - name: secrets-management
    rules:
      # Rotation is overdue: secret age exceeds its policy interval plus the
      # 7-day grace window. Metric is emitted by the secrets-rotation-check
      # workflow (textfile collector) and by a secret-age exporter.
      - alert: SecretRotationOverdue
        expr: >
          hw_secret_age_days > on(secret) hw_secret_rotation_limit_days
        for: 1h
        labels:
          severity: warning
          team: platform
          dashboard: hw-security
        annotations:
          summary: 'Secret {{ $labels.secret }} is overdue for rotation'
          description: >
            {{ $labels.secret }} ({{ $labels.env }}) is {{ $value | humanize }} days old,
            past its rotation limit. Rotate with
            scripts/secrets/rotate-secret.sh --env {{ $labels.env }} --secret {{ $labels.secret }}.
          runbook_url: 'https://github.com/health-watchers/health_watchers/blob/main/monitoring/runbooks/SECRETS_MANAGEMENT.md'

      # A rotation attempt failed (Lambda error, provider API error, job crash).
      - alert: SecretRotationFailed
        expr: increase(hw_secret_rotation_failures_total[6h]) > 0
        for: 5m
        labels:
          severity: critical
          team: platform
          dashboard: hw-security
        annotations:
          summary: 'Secret rotation failed for {{ $labels.secret }}'
          description: >
            {{ $value }} rotation failure(s) for {{ $labels.secret }} in the last 6h.
            Consumers may lose access when the old value is deprecated.
          runbook_url: 'https://github.com/health-watchers/health_watchers/blob/main/monitoring/runbooks/SECRETS_MANAGEMENT.md'

      # External Secrets Operator cannot keep a Secret in sync with the store.
      - alert: ExternalSecretSyncFailure
        expr: >
          externalsecret_status_condition{condition="Ready",status="False"} == 1
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'ExternalSecret {{ $labels.name }} not Ready for 15m'
          description: >
            ESO has not successfully synced {{ $labels.name }} in namespace
            {{ $labels.namespace }}. Pods may be running a stale secret.

      # Store is unreachable from ESO (network, IAM, or store outage).
      - alert: SecretStoreUnreachable
        expr: increase(externalsecret_sync_calls_error[10m]) > 3
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Secret store unreachable from ESO'
          description: >
            {{ $value }} failed sync calls to the secret store in 10m. Check
            AWS Secrets Manager / Vault availability and the IRSA / k8s-auth binding.

      # Access-rate anomaly: GetSecretValue well above the 7-day baseline.
      - alert: SecretAccessAnomaly
        expr: >
          sum(rate(hw_secret_access_total[10m])) by (env)
            > 3 * sum(rate(hw_secret_access_total[7d])) by (env)
        for: 10m
        labels:
          severity: warning
          team: security
          dashboard: hw-security
        annotations:
          summary: 'Unusual secret access rate in {{ $labels.env }}'
          description: >
            Secret read rate is more than 3x the 7-day baseline. Possible
            credential harvesting or a misbehaving client / hot loop.

      # Vault is sealed — no secrets can be served.
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Vault {{ $labels.instance }} is sealed'
          description: 'Vault cannot serve secrets. Auto-unseal (KMS) may have failed.'

      # Break-glass role used — always page.
      - alert: BreakGlassRoleAssumed
        expr: increase(hw_break_glass_assume_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          team: security
          page: 'true'
        annotations:
          summary: 'Break-glass secrets role was assumed'
          description: >
            {{ $value }} assume-role event(s) on the secrets break-glass role in
            the last 5m. Confirm this was an authorised incident response.

      # A secrets DR backup has not completed within the RPO window.
      - alert: SecretsDRBackupStale
        expr: time() - hw_secrets_dr_backup_timestamp_seconds > 5400
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Secrets DR backup is stale ({{ $labels.env }})'
          description: >
            No successful secrets DR backup in over 90 minutes (RPO target 1h).
            Check the secrets-dr-backup job / workflow.
