groups:
  - name: health-watchers-api
    interval: 30s
    rules:
      # API down — most critical alert
      - alert: APIDown
        expr: up{job="health-watchers-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: 'Health Watchers API is down'
          description: 'The API has been unreachable for more than 1 minute'
          runbook: 'monitoring/runbooks/API_DOWN.md'
          dashboard: 'http://grafana:3100/d/hw-api-performance'

      # Stellar service down
      - alert: StellarServiceDown
        expr: up{job="health-watchers-stellar"} == 0
        for: 1m
        labels:
          severity: critical
          service: stellar
        annotations:
          summary: 'Stellar service is down'
          description: 'The Stellar service has been unreachable for more than 1 minute'
          runbook: 'monitoring/runbooks/API_DOWN.md'

      # High HTTP error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
          service: api
        annotations:
          summary: 'High HTTP error rate on {{ $labels.job }}'
          description: 'Error rate is {{ $value | humanizePercentage }} (threshold: 5%)'
          runbook: 'monitoring/runbooks/HIGH_ERROR_RATE.md'
          dashboard: 'http://grafana:3100/d/hw-api-performance'

      # High p99 latency
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          ) > 2
        for: 2m
        labels:
          severity: warning
          service: api
        annotations:
          summary: 'High p99 latency on {{ $labels.job }}'
          description: 'p99 latency is {{ $value | humanizeDuration }} (threshold: 2s)'
          runbook: 'monitoring/runbooks/HIGH_LATENCY.md'
          dashboard: 'http://grafana:3100/d/hw-api-performance'

  - name: health-watchers-mongodb
    interval: 30s
    rules:
      # MongoDB connection pool utilisation
      - alert: MongoDBPoolHighUtilization
        expr: |
          (
            mongodb_connection_pool_size{job="health-watchers-api"}
            / 10
          ) > 0.8
        for: 2m
        labels:
          severity: warning
          service: mongodb
          component: database
        annotations:
          summary: 'MongoDB connection pool utilization is high'
          description: 'Pool utilization has exceeded 80% for more than 2 minutes'
          runbook: 'monitoring/runbooks/MONGODB_POOL_WAIT_QUEUE.md'

      # MongoDB pool wait queue non-empty
      - alert: MongoDBPoolWaitQueueNonEmpty
        expr: mongodb_pool_wait_queue_size{job="health-watchers-api"} > 0
        for: 2m
        labels:
          severity: critical
          service: mongodb
          component: database
        annotations:
          summary: 'MongoDB connection pool wait queue is non-empty'
          description: 'Requests are waiting for MongoDB connections — pool may be exhausted'
          runbook: 'monitoring/runbooks/MONGODB_POOL_WAIT_QUEUE.md'

      # Stellar keypair decryption failures
      - alert: StellarKeypairDecryptionFailure
        expr: increase(mongodb_keypair_decryption_failures_total{job="health-watchers-api"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: stellar
        annotations:
          summary: 'Stellar keypair decryption failure detected'
          description: 'One or more Stellar keypair decryption failures occurred in the last 5 minutes'
          runbook: 'monitoring/runbooks/STELLAR_KEYPAIR_DECRYPTION_FAILURE.md'
